<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f4f4;
    font-family:Arial;
}

/* SIDEBAR */

.sidebar{
    height:100vh;
    background:#212529;
    color:white;
    position:fixed;
    width:250px;
    padding-top:20px;
}

.sidebar h3{
    text-align:center;
    color:#ffc107;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    padding:12px 20px;
    color:white;
    text-decoration:none;
}

.sidebar a:hover{
    background:#ffc107;
    color:black;
}

/* MAIN */

.main{
    margin-left:250px;
    padding:20px;
}

.cart-box{
    background:white;
    border-radius:10px;
    padding:20px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.cart-img{
    width:100px;
    height:100px;
    object-fit:contain;
    border-radius:10px;
    background:#fff;
    padding:5px;
    border:1px solid #ddd;
}

.product-info{
    flex:1;
}

.price{
    color:green;
    font-weight:bold;
}

.qty-box{
    width:70px;
}

.remove-btn{
    border:none;
    background:red;
    color:white;
    padding:8px 12px;
    border-radius:5px;
}

.total-box{
    text-align:right;
    margin-top:20px;
}

.checkout-btn{
    width:200px;
}

.empty-cart{
    text-align:center;
    padding:50px;
    color:gray;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h3>Ecommerce User</h3>

    <a href="user-dashboard.html">
        <i class="fa fa-home"></i> Dashboard
    </a>

    <a href="cart.html">
        <i class="fa fa-shopping-cart"></i> Cart
    </a>

    <a href="orders.html">
        <i class="fa fa-box"></i> Orders
    </a>

    <a href="#" onClick="logout()">
        <i class="fa fa-sign-out"></i> Logout
    </a>

</div>

<!-- MAIN -->

<div class="main">

    <h2 class="mb-4">
        <i class="fa fa-shopping-cart"></i>
        My Cart
    </h2>

    <div class="cart-box">

        <div id="cartList"></div>

        <div class="total-box">

            <h4>
                Total :
               &#8377; <span id="totalPrice">0</span>
            </h4>

            <button
class="btn btn-success checkout-btn mt-2"
onclick="checkout()">

    Proceed To Checkout

</button>

        </div>

    </div>

</div>

<script>

let userId = localStorage.getItem("userId");

if(!userId){
    window.location.href = "user-login.html";
}

//
// LOAD CART
//
fetch("http://localhost:8081/api/cart/mycart/" + userId)

.then(res => res.json())

.then(data => {

    console.log(data);

    let output = "";

    let total = 0;

    if(data.length === 0){

        output = `
        <div class="empty-cart">

            <h3>Your cart is empty</h3>

        </div>
        `;

        document.getElementById("cartList").innerHTML = output;

        return;
    }

    data.forEach(item => {

        total += item.price * item.quantity;

        output += `

        <div class="cart-item">

            <img
            src="http://localhost:8081/uploads/${item.image}"
            class="cart-img">

            <div class="product-info">

                <h5>${item.name}</h5>

                <p class="price">
                    &#8377; ${item.price}
                </p>

                <div class="d-flex align-items-center gap-2">

    <label>Qty :</label>

    <input
        type="number"
        min="1"
        value="${item.quantity}"
        class="form-control qty-box"
        onchange="updateQuantity(${item.id}, this.value)">

</div>

            </div>

            <button
            class="remove-btn"
            onclick="removeCart(${item.id})">

                Remove

            </button>

        </div>
        `;
    });

    document.getElementById("cartList").innerHTML = output;

    document.getElementById("totalPrice").innerText = total;

})

.catch(err => {

    console.log(err);

});


//
// REMOVE CART
//
function removeCart(cartId){

    fetch("http://localhost:8081/api/cart/delete/" + cartId, {

        method:"DELETE"

    })

    .then(res => res.text())

    .then(msg => {

        alert(msg);

        location.reload();

    });
}
//
// UPDATE QUANTITY
//
function updateQuantity(cartId, qty){

    fetch("http://localhost:8081/api/cart/update/" + cartId + "/" + qty, {

        method:"PUT"

    })

    .then(res => res.text())

    .then(msg => {

        console.log(msg);

        location.reload();

    });
}

//
// CHECKOUT
//
function checkout(){

    let userId = localStorage.getItem("userId");

    if(!userId){
        alert("Login required");
        return;
    }

    fetch("http://localhost:8081/api/orders/checkout/" + userId, {
        method: "POST"
    })
    .then(res => res.text())
    .then(orderId => {

        console.log("ORDER ID:", orderId);

        if(orderId === "Cart is empty"){
            alert(orderId);
            return;
        }

        // STEP  GO TO PAYMENT PAGE
        window.location.href =
            "payment.html?orderId=" + orderId;

    })
    .catch(err => {
        console.log(err);
        alert("Checkout failed");
    });
}

//
// LOGOUT
//
function logout(){

    localStorage.clear();

    window.location.href = "user-login.html";
}

</script>

</body>
</html>
