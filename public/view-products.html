<!DOCTYPE html>
<html>
<head>
    <title>View Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f4f4;
        }

        .sidebar{
            height:100vh;
            width:250px;
            position:fixed;
            background:#212529;
            color:white;
            padding-top:20px;
        }

        .sidebar a{
            display:block;
            padding:12px;
            color:white;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#ffc107;
            color:black;
        }

        .main{
            margin-left:250px;
            padding:20px;
        }

        .product-img{
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:8px;
            border:1px solid #ccc;
        }

        table{
            background:white;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h3 class="text-center text-warning">Ecommerce Admin</h3>

    <a href="admin-dashboard.html">
        <i class="fa fa-dashboard"></i> Dashboard
    </a>

    <a href="add-product.html">
        <i class="fa fa-plus"></i> Add Product
    </a>

    <a href="view-products.html">
        <i class="fa fa-box"></i> View Products
    </a>

    <a href="view-users.html">
        <i class="fa fa-users"></i> Users
    </a>

    <a href="index.html">
        <i class="fa fa-sign-out"></i> Logout
    </a>

</div>

<!-- MAIN -->
<div class="main">

    <h2 class="mb-4">All Products</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Stock</th>
            </tr>

        </thead>

        <tbody id="data">

            <tr>
                <td colspan="6" class="text-center">
                    Loading products...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script>

fetch("http://localhost:8081/api/products/all")

.then(response => response.text())

.then(data => {

    console.log("RAW RESPONSE:", data);

    try{

        let products = JSON.parse(data);

        let rows = "";

        // NO PRODUCTS
        if(products.length === 0){

            rows = `
                <tr>
                    <td colspan="6" class="text-center text-danger">
                        No Products Found
                    </td>
                </tr>
            `;

        }else{

            // SHOW PRODUCTS
            products.forEach(product => {

                let imagePath = product.image
                    ? `http://localhost:8081/uploads/${product.image}`
                    : 'https://via.placeholder.com/70';

                rows += `

                    <tr>

                        <td>${product.id}</td>

                        <td>
                            <img
   src="http://localhost:8081/uploads/${product.image}"
   class="product-img"
>
                        </td>

                        <td>${product.name}</td>

                        <td>&#8377; ${product.price}</td>

                        <td>${product.category}</td>

                        <td>${product.stock}</td>

                    </tr>

                `;
            });

        }

        document.getElementById("data").innerHTML = rows;

    }catch(error){

        console.log("JSON ERROR:", error);

        document.getElementById("data").innerHTML = `

            <tr>
                <td colspan="6" class="text-center text-danger">
                    Backend API Error
                </td>
            </tr>

        `;
    }

})

.catch(error => {

    console.log("FETCH ERROR:", error);

});

</script>

</body>
</html>
