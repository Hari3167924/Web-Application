<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - EcommerceWeb</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* SIDEBAR */

        .sidebar{
            height:100vh;
            background:#212529;
            color:white;
            position:fixed;
            width:250px;
            padding-top:20px;
        }

        .sidebar h3{
            text-align:center;
            color:#ffc107;
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            padding:12px 20px;
            color:white;
            text-decoration:none;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#ffc107;
            color:black;
        }

        /* MAIN CONTENT */

        .main{
            margin-left:250px;
            padding:20px;
        }

        /* CARDS */

        .dash-card{
            border:none;
            border-radius:15px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .dash-card:hover{
            transform:translateY(-5px);
        }

        .icon-box{
            font-size:30px;
            color:#ffc107;
        }

        /* TABLE */

        .table th{
            background:#212529;
            color:white;
        }

        footer{
            margin-top:40px;
            text-align:center;
            padding:15px;
            background:#111;
            color:white;
        }

        @media(max-width:768px){

            .sidebar{
                width:100%;
                height:auto;
                position:relative;
            }

            .main{
                margin-left:0;
            }
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h3>Ecommerce Admin</h3>

    <a href="admin-dashboard.html">
        <i class="fa fa-dashboard"></i> Dashboard
    </a>

    <a href="add-product.html">
        <i class="fa fa-plus"></i> Add Product
    </a>

    <a href="view-products.html">
        <i class="fa fa-box"></i> View Products
    </a>

    <a href="view-users.html">
        <i class="fa fa-users"></i> Users
    </a>

    <a href="admin-orders.html">
        <i class="fa fa-shopping-cart"></i> Orders
    </a>

    <a href="index.html">
        <i class="fa fa-sign-out"></i> Logout
    </a>

</div>

<!-- MAIN CONTENT -->

<div class="main">

    <h2 class="mb-4">Admin Dashboard</h2>

    <!-- DASH CARDS -->

    <div class="row g-4">

        <!-- PRODUCTS -->

        <div class="col-md-3">

            <div class="card dash-card p-3 text-center">

                <div class="icon-box">
                    <i class="fa fa-box"></i>
                </div>

                <h5>Total Products</h5>

                <h3 id="productCount">0</h3>

            </div>

        </div>

        <!-- USERS -->

        <div class="col-md-3">

            <div class="card dash-card p-3 text-center">

                <div class="icon-box">
                    <i class="fa fa-users"></i>
                </div>

                <h5>Users</h5>

                <h3 id="userCount">0</h3>

            </div>

        </div>

        <!-- ORDERS -->

        <div class="col-md-3">

            <div class="card dash-card p-3 text-center">

                <div class="icon-box">
                    <i class="fa fa-shopping-cart"></i>
                </div>

                <h5>Orders</h5>

                <h3 id="orderCount">0</h3>

            </div>

        </div>

        <!-- DELIVERED -->

        <div class="col-md-3">

            <div class="card dash-card p-3 text-center">

                <div class="icon-box">
                    <i class="fa fa-truck"></i>
                </div>

                <h5>Delivered Orders</h5>

                <h3 id="deliveredCount">0</h3>

            </div>

        </div>

    </div>

    <!-- PRODUCT TABLE -->

    <div class="mt-5">

        <h4>Latest Products</h4>

        <div class="table-responsive">

            <table class="table table-bordered table-hover mt-3">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Stock</th>
                    
                    </tr>

                </thead>

                <tbody id="productTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- FOOTER -->

<footer>

   EcommerceWeb Admin Panel

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- DASHBOARD SCRIPT -->

<script>

// LOAD PRODUCTS

fetch("http://localhost:8081/api/products/all")

.then(res => res.json())

.then(products => {

    // TOTAL PRODUCT COUNT
    document.getElementById("productCount").innerText =
        products.length;

    // LATEST PRODUCTS TABLE
    let rows = "";

    products.slice(-5).reverse().forEach(p => {

        rows += `

        <tr>

            <td>${p.id}</td>

            <td>${p.name}</td>

            <td>₹${p.price}</td>

            <td>${p.category}</td>

            <td>${p.stock}</td>

        </tr>

        `;
    });

    document.getElementById("productTable").innerHTML =
        rows;

})

.catch(error => {

    console.log(error);

});


// LOAD USERS

fetch("http://localhost:8081/api/users/all")

.then(res => res.json())

.then(users => {

    document.getElementById("userCount").innerText =
        users.length;

})

.catch(error => {

    console.log(error);

});


// LOAD ORDERS

fetch("http://localhost:8081/api/orders/all")

.then(res => res.json())

.then(orders => {

    // TOTAL ORDERS
    document.getElementById("orderCount").innerText =
        orders.length;

    // DELIVERED ORDERS
    let delivered = orders.filter(order =>
        order.status === "Delivered"
    ).length;

    document.getElementById("deliveredCount").innerText =
        delivered;

})

.catch(error => {

    console.log(error);

});

</script>

</body>
</html>
