<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UPI Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f6f9;
    font-family:Arial;
}

.payment-box{

    max-width:450px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.payment-header{
    text-align:center;
    margin-bottom:25px;
}

.payment-header i{
    font-size:60px;
    color:#28a745;
}

.payment-header h2{
    margin-top:10px;
    font-weight:bold;
}

.order-box{
    background:#f8f9fa;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.pay-btn{
    width:100%;
    padding:12px;
    font-size:18px;
    border-radius:10px;
}

.qr-box{
    text-align:center;
    margin-bottom:20px;
}

.qr-box img{
    width:180px;
}

</style>

</head>

<body>

<div class="container">

    <div class="payment-box">

        <!-- HEADER -->
        <div class="payment-header">

            <i class="fa fa-qrcode"></i>

            <h2>UPI Payment</h2>

            <p class="text-muted">
                Scan & Pay Using Any UPI App
            </p>

        </div>

        <!-- ORDER INFO -->
        <div class="order-box">

            <h5>
                Order ID :
                <span id="orderId"></span>
            </h5>

            <p id="statusText"
               class="text-warning">

               Payment Status : Pending

            </p>

        </div>

        <!-- QR -->
        <div class="qr-box">

            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay"
            alt="QR">

            <p class="mt-2">
                UPI ID : demo@upi
            </p>

        </div>

        <!-- TRANSACTION INPUT -->
        <div class="mb-3">

            <label class="form-label">
                Enter UPI Transaction ID
            </label>

            <input type="text"
                   id="txn"
                   class="form-control"
                   placeholder="Enter Transaction Number">

        </div>

        <!-- PAY BUTTON -->
        <button class="btn btn-success pay-btn"
                onclick="payNow()">

            <i class="fa fa-check"></i>
            Payment

        </button>

    </div>

</div>

<script>

let orderId = new URLSearchParams(window.location.search)
                    .get("orderId");

document.getElementById("orderId").innerText = orderId;

function payNow(){

    let txn = document.getElementById("txn").value;

    if(txn === ""){
        alert("Enter transaction ID");
        return;
    }

    fetch("http://localhost:8081/api/orders/status/" + orderId + "?status=PAID", {
        method: "PUT"
    })
    .then(res => res.text())
    .then(data => {

        alert("Payment Successful");

        window.location.href = "orders.html";

    })
    .catch(err => {
        alert("Payment Failed");
    });

}

</script>

</body>
</html>
