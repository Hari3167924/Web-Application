<!DOCTYPE html>
<html>
<head>
<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{background:#f4f4f4;}
.sidebar{height:100vh;width:250px;position:fixed;background:#212529;color:white;padding-top:20px;}
.sidebar a{display:block;padding:12px;color:white;text-decoration:none;}
.sidebar a:hover{background:#ffc107;color:black;}
.main{margin-left:250px;padding:20px;}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3 class="text-center text-warning">Ecommerce Admin</h3>
    <a href="admin-dashboard.html"><i class="fa fa-dashboard"></i> Dashboard</a>
    <a href="add-product.html"><i class="fa fa-plus"></i> Add Product</a>
    <a href="view-products.html"><i class="fa fa-box"></i> View Products</a>
    <a href="view-users.html"><i class="fa fa-users"></i> Users</a>
	<a href="index.html"><i class="fa fa-sign-out"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<h2>Add Product</h2>

<form id="productForm" enctype="multipart/form-data">

<input type="text" name="name" class="form-control mb-2" placeholder="Product Name" required>

<input type="number" name="price" class="form-control mb-2" placeholder="Price" required>

<input type="text" name="category" class="form-control mb-2" placeholder="Category" required>

<input type="number" name="stock" class="form-control mb-2" placeholder="Stock" required>

<input type="file" name="image" class="form-control mb-2" required>

<button class="btn btn-success">Add Product</button>

</form>

</div>

<script>

document.getElementById("productForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let formData = new FormData(this);

    fetch("http://localhost:8081/api/products/add", {

        method: "POST",

        body: formData

    })

    .then(res => res.text())

    .then(data => {

        alert(data);

        window.location.href =
            "view-products.html";

    })

    .catch(error => {

        console.log(error);

        alert("Product Add Failed");

    });

});

</script>

</body>
</html>
