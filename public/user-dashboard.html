<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f4f4;
    font-family:Arial;
}

.sidebar{
    height:100vh;
    background:#212529;
    color:white;
    position:fixed;
    width:250px;
    padding-top:20px;
}

.sidebar h3{
    text-align:center;
    color:#ffc107;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    padding:12px 20px;
    color:white;
    text-decoration:none;
}

.sidebar a:hover{
    background:#ffc107;
    color:black;
}

.main{
    margin-left:250px;
    padding:20px;
}

.user-box{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.product-card{
    border:none;
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
}

.product-card:hover{
    transform:scale(1.03);
}

.product-img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:#fff;
    padding:10px;
}

.price{
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Ecommerce User</h3>

<a href="user-dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
<a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a>
<a href="orders.html"><i class="fa fa-box"></i> Orders</a>
<a href="#" onClick="logout()"><i class="fa fa-sign-out"></i> Logout</a>

</div>

<!-- MAIN -->
<div class="main">

<!-- USER BOX -->
<div class="user-box">

<h3>Welcome, <span id="fullname">Loading...</span></h3>

<p>Username: <span id="username">Loading...</span></p>
<p>User ID: <span id="userid">Loading...</span></p>

</div>

<!-- SEARCH -->
<div class="row mb-3">

    <div class="col-md-10">
        <input type="text" id="searchBox" class="form-control"
        placeholder="Search product or category...">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary w-100" onClick="filterProducts()">
            Search
        </button>
    </div>

</div>

<!-- PRODUCTS -->
<div class="row" id="productList"></div>

</div>

<!-- SCRIPT -->
<script>


//
// PROFILE
//
/*fetch("http://localhost:8081/api/users/profile", {

})

const userId = localStorage.getItem("userId");
const username = localStorage.getItem("username");
const fullname = localStorage.getItem("fullname");

if(!userId){
    window.location.href = "user-login.html";
}

document.getElementById("fullname").innerText = fullname;
document.getElementById("username").innerText = username;
document.getElementById("userid").innerText = userId;

</script>
<script>

let allProducts = [];

//
// LOAD PRODUCTS (DEFAULT ALL)
//
fetch("http://localhost:8081/api/products/all")
.then(res => res.json())
.then(data => {

    allProducts = data;

    showProducts(allProducts); // show ALL by default
});


//
// SHOW PRODUCTS
//
function showProducts(products) {

    let output = "";

    if (!Array.isArray(products)) {
        console.error("Invalid product data", products);
        return;
    }

    products.forEach(p => {

        output += `
        <div class="col-md-4 mb-4">

            <div class="card product-card">

                <img src="http://localhost:8081/uploads/${p.image}"
                class="product-img">

                <div class="card-body text-center">

                    <h5>${p.name}</h5>

                    <p class="price">&#8377; ${p.price}</p>

                    <p>${p.category}</p>

                    <button class="btn btn-warning w-100"
                    onclick="addToCart(${p.id})">

                        Add To Cart

                    </button>

                </div>

            </div>

        </div>`;
    });

    document.getElementById("productList").innerHTML = output;
}


//
// SEARCH FILTER (NAME + CATEGORY + PRICE TEXT SEARCH)
//
function filterProducts() {

    let search = document.getElementById("searchBox").value.toLowerCase();

    if (search === "") {
        showProducts(allProducts);
        return;
    }

    let filtered = allProducts.filter(p => {

        return (
            p.name.toLowerCase().includes(search) ||
            p.category.toLowerCase().includes(search) ||
            String(p.price).includes(search)
        );
    });

    showProducts(filtered);
}


//
// ADD TO CART
//
function addToCart(productId) {

    let userId = localStorage.getItem("userId");

    if(!userId){
        alert("Please login first");
        window.location.href = "user-login.html";
        return;
    }

    fetch("http://localhost:8081/api/cart/add", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            userId:userId,
            productId:productId,
            quantity:1
        })
    })
    .then(res => res.text())
    .then(msg => alert(msg));
}

</script>

<script>
//
// LOGOUT
//
function logout() {

    fetch("http://localhost:8081/api/users/logout", {
        credentials: "include"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        window.location.href = "user-login.html";
    });
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
