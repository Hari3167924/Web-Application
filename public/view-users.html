<!DOCTYPE html>
<html>
<head>
<title>View Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{background:#f4f4f4;}
.sidebar{height:100vh;width:250px;position:fixed;background:#212529;color:white;padding-top:20px;}
.sidebar a{display:block;padding:12px;color:white;text-decoration:none;}
.sidebar a:hover{background:#ffc107;color:black;}
.main{margin-left:250px;padding:20px;}
</style>

</head>

<body>

<div class="sidebar">
    <h3 class="text-center text-warning">Ecommerce Admin</h3>
    <a href="admin-dashboard.html"><i class="fa fa-dashboard"></i> Dashboard</a>
    <a href="add-product.html"><i class="fa fa-plus"></i> Add Product</a>
    <a href="view-products.html"><i class="fa fa-box"></i> View Products</a>
    <a href="view-users.html"><i class="fa fa-users"></i> Users</a>
	<a href="index.html"><i class="fa fa-sign-out"></i> Logout</a>
</div>

<div class="main">

<h2>Users List</h2>

<table class="table table-bordered">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Mobile No.</th>
<th>Address</th>
</tr>
</thead>

<tbody id="users"></tbody>
</table>

</div>

<script>

fetch("http://localhost:8081/api/users/all")

.then(res => res.json())

.then(data => {

    let rows = "";

    data.forEach(u => {

        rows += `

        <tr>

            <td>${u.id}</td>

            <td>${u.fullname}</td>

            <td>${u.email}</td>

            <td>${u.mobile}</td>
			
			<td>${u.address}</td>

        </tr>

        `;
    });

    document.getElementById("users").innerHTML = rows;

})

.catch(error => {

    console.log(error);

    alert("Failed To Load Users");

});

</script>

</body>
</html>
